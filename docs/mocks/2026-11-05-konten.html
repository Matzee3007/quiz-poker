<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Mock Konten – Quiz-Poker</title>
<style>
/* ---------- Rahmen des Mocks, gehört nicht zur App ---------- */
html{scroll-behavior:auto}
body{margin:0;background:#e9e9ec;color:#1c1f26;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;min-width:1100px}
.m-kopf{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #cfd0d6;padding:12px 24px}
.m-kopf h1{font-size:19px;margin:0 14px 0 0;display:inline}
.m-kopf .m-notiz{color:#555a66;font-size:13.5px}
.m-sprung{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;font-size:13.5px}
.m-sprung b{color:#555a66;font-weight:600;margin-left:12px}
.m-sprung b:first-child{margin-left:0}
.m-sprung a{border:1px solid #bfc1c9;background:#fff;color:#1c1f26;border-radius:7px;padding:3px 10px;text-decoration:none}
.m-sprung a:hover{background:#1c1f26;color:#fff}
.m-teil{padding:34px 24px 6px;scroll-margin-top:90px}
.m-teil h2{font-size:25px;margin:0}
.m-teil p{margin:3px 0 0;color:#3f4450;max-width:900px}
.m-zustand{padding:22px 24px 8px;scroll-margin-top:90px}
.m-zustand h3{font-size:17px;margin:0}
.m-zustand p{margin:1px 0 0;color:#3f4450}
.m-browser{background:#d5d6db;padding:7px 12px;font-size:12.5px;color:#444955;display:flex;gap:10px;align-items:center}
.m-browser i{width:10px;height:10px;border-radius:50%;background:#a9abb3;display:inline-block}
.m-browser span{background:#fff;border-radius:6px;padding:2px 12px;margin-left:8px;flex:1}
.m-ende{padding:26px 24px 44px;color:#555a66;font-size:13.5px}

/* ---------- aus src/stil.css übernommen (Stil C), body-Regeln liegen auf .schirm ---------- */
.schirm{--grund:#0c0e13;--flaeche:#12151c;--knopf:#1c212b;--schrift:#eef0f4;--matt:#a3a9b6;--linie:#262b36;--linie-stark:#3b4252;--gold:#e8bb4f;--gold-schrift:#17120a;--gruen:#2fd98c;--rot:#ff5c6c;--radius:6px;
  color-scheme:dark;background:var(--grund);color:var(--schrift);font-family:"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.45}
*{box-sizing:border-box}
.schirm h1,.schirm h2,.schirm p{margin:0}
.schirm p{overflow-wrap:anywhere}
.schirm button,.schirm input{font:inherit;color:inherit}
.schirm button{background:var(--knopf);border:1px solid var(--linie-stark);border-radius:var(--radius);padding:9px 16px;cursor:pointer;font-weight:600}
.schirm button:hover:not(:disabled){border-color:var(--gold)}
.schirm button:focus-visible,.schirm input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.schirm button.haupt{background:var(--gold);border-color:var(--gold);color:var(--gold-schrift)}
.schirm button.falsch-an{background:var(--rot);border-color:var(--rot);color:#1a0508}
.schirm button.text{background:none;border:none;color:var(--matt);padding:4px;font-weight:400;text-decoration:underline}
.schirm input{background:var(--grund);border:1px solid var(--linie-stark);border-radius:var(--radius);padding:10px 12px;width:100%}
.schirm label{display:block;color:var(--matt);font-size:14px;margin-bottom:6px}
.kopf{display:flex;align-items:center;gap:24px;background:var(--flaeche);border-bottom:1px solid var(--linie);padding:14px 32px}
.logo{flex:none;color:var(--gold);font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.kopf .rest{flex:none;margin-left:auto;display:flex;gap:20px;align-items:center;color:var(--matt);font-size:14px}
.schritt.an{background:var(--gold);color:var(--gold-schrift);border-radius:999px;padding:2px 10px;font-weight:700}
.seite{max-width:1280px;margin:0 auto;padding:32px;width:100%}
.zwei-spalten{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start}
.karte{background:var(--flaeche);border:1px solid var(--linie);border-radius:var(--radius);padding:24px}
.stapel{display:flex;flex-direction:column;gap:18px}
.reihe{display:flex;gap:12px;align-items:center}
.ueberschrift{color:var(--matt);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.matt{color:var(--matt)}
.klein{font-size:14px}
.gold{color:var(--gold);font-weight:700}
.hinweis{background:var(--gold);color:var(--gold-schrift);border-radius:var(--radius);padding:10px 14px;font-weight:600}
.hinweis.fehler{background:var(--rot);color:#1a0508}
.notiz{border-left:3px solid var(--gold);border-radius:0 var(--radius) var(--radius) 0;padding:10px 14px;font-size:15px}
.spielidee{display:flex;flex-direction:column;gap:10px}
.spielidee h1{color:var(--gold);font-size:40px;line-height:1.1}
.wege{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.weg{display:flex;flex-direction:column;gap:8px}
.weg button{width:100%}
.feld-fehler label{color:var(--rot);font-weight:600}
.schirm .feld-fehler input{border-color:var(--rot);box-shadow:0 0 0 1px var(--rot);background:#23101a}

/* ---------- neu für die Konto-Ansichten ---------- */
.schirm{display:flex;flex-direction:column;min-height:440px}
.schirm main{flex:1}
.seiten-fuss{width:100%;max-width:1280px;margin:0 auto;padding:0 32px 18px;font-size:13px}
.feld-hilfe{margin-top:6px}
.notiz.warnung{border-left-color:var(--rot)}
.linie-oben{border-top:1px solid var(--linie);padding-top:18px}
.schirm button.voll{width:100%}
.schmal{width:440px;margin:0 auto;padding:48px 0 32px}
.adresse{font-weight:700;overflow-wrap:anywhere}
.adresse.gross{font-size:30px;line-height:1.25}
.kopf-lang{display:inline-block;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.kopf .rest strong{color:var(--schrift);padding:4px}
.m-streifen{margin:0 0 2px}
.m-streifen-titel{padding:12px 24px 5px;font-size:13.5px;color:#3f4450}
</style>
</head>
<body>

<div class="m-kopf">
  <h1>Mock Konten</h1>
  <span class="m-notiz">Wegwerf-Entwurf bei echter PC-Breite. Alle Adressen und Passwörter sind Beispieldaten. Jeder Zustand steht als eigenes Bild untereinander, die Knöpfe tun nichts.</span>
  <div class="m-sprung" id="sprung"></div>
</div>

<div id="inhalt"></div>
<div class="m-ende">Ende des Mocks.</div>

<script>
const ADRESSE='mara@beispiel.de', LANG='maximiliane.mustermann-wiesenthal@familie-beispiel.de', HOST='quiz-poker.quiz-poker.workers.dev';
const WEG_VERGESSEN='Melde dich beim Betreiber, der dir auch die Einladung geschickt hat. Du bekommst dann einen Link, mit dem du ein neues Passwort setzt. E-Mails verschickt diese Seite nicht.';
const NUR_LOGIN='Deine E-Mail-Adresse ist nur dein Login-Name. Sie wird nicht geprüft, und diese Seite schreibt dir nie. Merk sie dir also genau so, wie du sie hier eintippst.';
const WARNUNG='Das Löschen ist endgültig. Deine Adresse und dein Passwort werden sofort entfernt, und niemand kann das Konto wiederherstellen. Spielen kannst du weiter ohne Konto.';

/* ----- Kopf der Seite ----- */
const kopf=rest=>`<header class="kopf"><span class="logo">Quiz-Poker</span><div class="rest">${rest}</div></header>`;
const ZUM_START='<button class="text">Zum Start</button>';
const K={
  start:kopf('<span>Spielen geht ohne Konto</span><button class="text">Anmelden</button>'),
  startAn:kopf('<button class="text">Konto</button>'),
  anmelden:kopf(ZUM_START),
  gast:kopf(ZUM_START+'<button class="text">Anmelden</button>'),
  konto:kopf(ZUM_START+'<strong>Konto</strong>'),
  adresse:kopf(`<button class="text">${ADRESSE}</button>`),
  lang:kopf(`<button class="text kopf-lang" title="${LANG}">${LANG}</button>`),
};
const FUSS='<footer class="seiten-fuss"><button class="text">Datenschutz</button></footer>';

/* ----- Bausteine ----- */
let nr=0;
function feld(lab,typ,wert='',o={}){
  const id='f'+(++nr);
  return `<div class="${o.fehler?'feld-fehler':''}"><label for="${id}">${lab}</label><input id="${id}" type="${typ}" value="${wert}" autocomplete="off">${o.hilfe?`<p class="matt klein feld-hilfe">${o.hilfe}</p>`:''}</div>`;
}
const fehler=t=>`<p class="hinweis fehler" role="alert">${t}</p>`;
const PW='geheimes-wort';

function rahmen(id,titel,satz,pfad,kopfHtml,inhalt){
  return `<section class="m-zustand" id="${id}"><h3>${titel}</h3><p>${satz}</p></section>
  <div class="m-browser"><i></i><i></i><i></i><span>${HOST}${pfad}</span></div>
  <div class="schirm">${kopfHtml}${inhalt}${FUSS}</div>`;
}

/* ----- Startseite, Texte unverändert aus src/ansichten/Start.svelte ----- */
const START=`<main class="seite stapel">
  <section class="spielidee"><h1>Setze deine Chips auf dein Wissen.</h1>
    <p class="matt">Alle starten mit 100 Chips und setzen, sobald die Kategorie feststeht. Erst danach kommt die Frage. Richtig bringt den Einsatz dazu, falsch kostet ihn. Am Ende gewinnt, wer die meisten Chips hat.</p></section>
  <div class="zwei-spalten">
    <section class="karte stapel"><h2>Spielraum eröffnen</h2>
      <p class="matt">Du leitest die Partie als Quiz-Master und spielst nicht mit.</p>
      <div class="wege">
        <div class="weg"><button class="haupt">Beispiel-Quiz spielen</button><p class="matt klein">Sofort los mit dem fest eingebauten Quiz.</p></div>
        <div class="weg"><button>Eigenes Quiz erstellen</button><p class="matt klein">Kategorien und Fragen selbst schreiben, ohne Konto. Das Einmal-Quiz gilt nur für diesen Spielraum.</p></div>
      </div>
    </section>
    <section class="karte stapel"><h2>Spielraum beitreten</h2>
      <div><label>Raumcode</label><input maxlength="4" autocomplete="off"></div>
      <div><label>Dein Name</label><input maxlength="20" autocomplete="off"></div>
      <div class="reihe"><button class="haupt">Beitreten</button></div>
    </section>
  </div></main>`;

/* ----- Variante A: schmale, mittige Karte ----- */
const schmal=inhalt=>`<main class="schmal"><section class="karte stapel">${inhalt}</section></main>`;
const A={
  anmelden:(meldung='',a='',p='')=>schmal(`<h2>Anmelden</h2><p class="matt klein">Zum Spielen brauchst du kein Konto.</p>${meldung}
    ${feld('E-Mail','email',a)}${feld('Passwort','password',p)}<button class="haupt voll">Anmelden</button>
    <p class="matt klein linie-oben"><strong>Passwort vergessen?</strong> ${WEG_VERGESSEN}</p>`),
  registrieren:(meldung='',a='',p='',o={})=>schmal(`<h2>Konto anlegen</h2><p class="matt klein">Du hast eine Einladung bekommen. Sie gilt für ein Konto.</p>${meldung}
    ${feld('E-Mail','email',a,o)}<p class="notiz">${NUR_LOGIN}</p>${feld('Passwort','password',p,{hilfe:'Mindestens 8 Zeichen'})}<button class="haupt voll">Konto anlegen</button>`),
  eingeladenNicht:()=>schmal(`<h2>Konto anlegen</h2>${fehler('Diese Einladung gilt nicht mehr.')}<p class="matt">Eine Einladung gilt für genau ein Konto. Bitte den Betreiber um eine neue.</p><button class="voll">Zum Start</button>`),
  passwort:()=>schmal(`<h2>Neues Passwort setzen</h2>${feld('Neues Passwort','password','',{hilfe:'Mindestens 8 Zeichen'})}<button class="haupt voll">Passwort speichern</button>
    <p class="matt klein linie-oben">Danach bist du auf allen Geräten abgemeldet und meldest dich mit dem neuen Passwort an.</p>`),
  passwortOk:()=>schmal(`<h2>Neues Passwort setzen</h2><p class="hinweis">Dein neues Passwort gilt.</p><p class="matt">Du bist auf allen Geräten abgemeldet. Melde dich jetzt mit dem neuen Passwort an.</p><button class="haupt voll">Zum Anmelden</button>`),
  passwortNicht:()=>schmal(`<h2>Neues Passwort setzen</h2>${fehler('Dieser Link gilt nicht mehr.')}<p class="matt">Ein Link gilt 24 Stunden und nur einmal. Bitte den Betreiber um einen neuen.</p><button class="voll">Zum Start</button>`),
  konto:(loeschen='')=>schmal(`<h2>Dein Konto</h2>
    <div><div class="ueberschrift">Angemeldet als</div><p class="adresse gold">${ADRESSE}</p></div>
    <div><button>Abmelden</button></div>
    <p class="matt klein">Das Speichern von Quizzen kommt später.</p>
    <div class="stapel linie-oben">${loeschen||'<div><button>Konto löschen</button></div>'}</div>`),
  loeschen:(falsch)=>`<h2>Konto löschen</h2>${falsch?fehler('Das Passwort stimmt nicht. Dein Konto bleibt bestehen.'):''}<p class="notiz warnung">${WARNUNG}</p>
    ${feld('Passwort zur Bestätigung','password',falsch?PW:'',{fehler:falsch})}
    <div class="reihe"><button class="falsch-an">Konto endgültig löschen</button><button>Abbrechen</button></div>`,
};

/* ----- Variante B: Aufbau der Startseite ----- */
const breit=(titel,satz,meldung,links,rechts)=>`<main class="seite stapel">
  <section class="spielidee"><h1>${titel}</h1><p class="matt">${satz}</p></section>${meldung}
  <div class="zwei-spalten"><section class="karte stapel">${links}</section><section class="karte stapel">${rechts}</section></div></main>`;
const nurEine=(titel,meldung,links)=>`<main class="seite stapel">
  <section class="spielidee"><h1>${titel}</h1></section>${meldung}
  <section class="karte stapel">${links}</section></main>`;
const B={
  anmelden:(meldung='',a='',p='')=>breit('Anmelden','Zum Spielen brauchst du kein Konto.',meldung,
    `<h2>Deine Zugangsdaten</h2><div class="wege">${feld('E-Mail','email',a)}${feld('Passwort','password',p)}</div><div class="reihe"><button class="haupt">Anmelden</button></div>`,
    `<h2>Passwort vergessen?</h2><p class="matt klein">${WEG_VERGESSEN}</p>`),
  registrieren:(meldung='',a='',p='',o={})=>breit('Du bist eingeladen.','Leg dein Konto an. Die Einladung gilt für ein Konto.',meldung,
    `<h2>Konto anlegen</h2><div class="wege">${feld('E-Mail','email',a,o)}${feld('Passwort','password',p,{hilfe:'Mindestens 8 Zeichen'})}</div><div class="reihe"><button class="haupt">Konto anlegen</button></div>`,
    `<h2>Merk dir deine Adresse</h2><p class="matt klein">${NUR_LOGIN}</p>`),
  eingeladenNicht:()=>nurEine('Konto anlegen',fehler('Diese Einladung gilt nicht mehr.'),
    `<p class="matt">Eine Einladung gilt für genau ein Konto. Bitte den Betreiber um eine neue.</p><div class="reihe"><button>Zum Start</button></div>`),
  passwort:()=>breit('Neues Passwort setzen','Der Betreiber hat dir diesen Link geschickt. Er gilt einmal.','',
    `<h2>Dein neues Passwort</h2><div class="wege">${feld('Neues Passwort','password','',{hilfe:'Mindestens 8 Zeichen'})}<div></div></div><div class="reihe"><button class="haupt">Passwort speichern</button></div>`,
    `<h2>Danach</h2><p class="matt klein">Du bist auf allen Geräten abgemeldet und meldest dich mit dem neuen Passwort an.</p>`),
  passwortOk:()=>nurEine('Neues Passwort setzen','<p class="hinweis">Dein neues Passwort gilt.</p>',
    `<p class="matt">Du bist auf allen Geräten abgemeldet. Melde dich jetzt mit dem neuen Passwort an.</p><div class="reihe"><button class="haupt">Zum Anmelden</button></div>`),
  passwortNicht:()=>nurEine('Neues Passwort setzen',fehler('Dieser Link gilt nicht mehr.'),
    `<p class="matt">Ein Link gilt 24 Stunden und nur einmal. Bitte den Betreiber um einen neuen.</p><div class="reihe"><button>Zum Start</button></div>`),
  konto:(loeschen='')=>breit('Dein Konto','Das Speichern von Quizzen kommt später.','',
    `<div class="ueberschrift">Angemeldet als</div><p class="adresse gross gold">${ADRESSE}</p><div class="reihe"><button>Abmelden</button></div>`,
    loeschen||'<h2>Konto löschen</h2><p class="matt klein">Entfernt deine Adresse und dein Passwort.</p><div><button>Konto löschen</button></div>'),
  loeschen:(falsch)=>`<h2>Konto löschen</h2>${falsch?fehler('Das Passwort stimmt nicht. Dein Konto bleibt bestehen.'):''}<p class="notiz warnung klein">${WARNUNG}</p>
    ${feld('Passwort zur Bestätigung','password',falsch?PW:'',{fehler:falsch})}
    <button class="falsch-an voll">Konto endgültig löschen</button><button class="voll">Abbrechen</button>`,
};

/* ----- Zustände, für beide Varianten gleich ----- */
function zustaende(V,x){
  return [
   rahmen(x+'2a','2a Anmelden','Grundzustand, ohne Knopf zum Registrieren.','/anmelden',K.anmelden,V.anmelden()),
   rahmen(x+'2b','2b Anmelden: falsche Angaben','Die Meldung sagt bewusst nicht, ob Adresse oder Passwort falsch war.','/anmelden',K.anmelden,V.anmelden(fehler('E-Mail oder Passwort stimmt nicht.'),ADRESSE)),
   rahmen(x+'2c','2c Anmelden: zu viele Versuche','Erscheint ab dem 11. Versuch innerhalb einer Minute.','/anmelden',K.anmelden,V.anmelden(fehler('Zu viele Versuche, bitte warte eine Minute.'),ADRESSE)),
   rahmen(x+'3a','3a Registrieren','Erreicht über den Einladungslink, sonst führt kein Weg hierher.','/registrieren?code=…',K.gast,V.registrieren()),
   rahmen(x+'3b','3b Registrieren: Einladung ungültig','Der Server erkennt das erst beim Absenden, das Formular verschwindet dann, weil es nicht mehr hilft.','/registrieren',K.gast,V.eingeladenNicht()),
   rahmen(x+'3c','3c Registrieren: Adresse vergeben','Das Feld ist markiert und die Einladung bleibt gültig, ein neuer Versuch genügt.','/registrieren',K.gast,V.registrieren(fehler('Diese Adresse ist schon vergeben.'),ADRESSE,PW,{fehler:true,hilfe:'Deine Einladung gilt weiter. Nimm eine andere Adresse oder melde dich mit dieser an.'})),
   rahmen(x+'4a','4a Passwort neu setzen','Erreicht über den Link vom Betreiber.','/passwort-neu?token=…',K.gast,V.passwort()),
   rahmen(x+'4b','4b Passwort neu setzen: geklappt','Erfolgszustand mit Weg zum Anmelden.','/passwort-neu',K.gast,V.passwortOk()),
   rahmen(x+'4c','4c Passwort neu setzen: Link ungültig','Auch das erkennt der Server erst beim Absenden.','/passwort-neu',K.gast,V.passwortNicht()),
   rahmen(x+'5a','5a Konto','Adresse, Abmelden und der Einstieg zum Löschen.','/konto',K.konto,V.konto()),
   rahmen(x+'5b','5b Konto löschen: Abfrage offen','Warnung und Passwort erscheinen erst nach dem Klick auf „Konto löschen“.','/konto',K.konto,V.konto(V.loeschen(false))),
   rahmen(x+'5c','5c Konto löschen: falsches Passwort','Das Konto bleibt und die Abfrage bleibt offen.','/konto',K.konto,V.konto(V.loeschen(true))),
  ].join('');
}
const INGAME=`<header class="kopf"><span class="logo">Quiz-Poker</span><span class="matt">Spielraum <strong>KLMN</strong></span><span class="matt">Kategorie <strong>Geographie</strong> · Runde <strong>2 von 3</strong></span><div class="rest"><span class="schritt an">Einsatz</span><span class="schritt">Antwort</span><span class="schritt">Auswertung</span><span class="schritt">Auflösung</span><strong>Quiz-Master</strong></div></header>`;
const streifen=(titel,html)=>`<div class="m-streifen-titel">${titel}</div><div class="m-streifen schirm" style="min-height:0">${html}</div>`;

const teile={
 gemeinsam:`<section class="m-teil" id="gemeinsam"><h2>Für beide Varianten gleich: Start und Kopf</h2><p>Die Startseite bleibt, wie sie ist. Dazu kommen nur der Eintrag im Kopf und der Link am Seitenende.</p></section>`
   +rahmen('z1','1 Start ohne Anmeldung','Anmelden ist ein leiser Textlink, daneben steht, dass Spielen ohne Konto geht.','/',K.start,START)
   +rahmen('z6','6 Start mit Anmeldung, Kopf zeigt „Konto“','Alles andere bleibt gleich, auch der Hinweis „ohne Konto“ beim Einmal-Quiz, denn das gilt weiterhin.','/',K.startAn,START)
   +streifen('6 Alternative: Adresse statt „Konto“',K.adresse)
   +streifen('6 Alternative: lange Adresse wird nach 240 Pixeln gekürzt',K.lang)
   +streifen('Annahme: In der Partie bleibt der Kopf wie heute, ohne Konto-Eintrag, weil er dort schon voll ist',INGAME),
 a:`<section class="m-teil" id="varianteA"><h2>Variante A: Schmale, mittige Karte</h2><p>Eine Spalte mit 440 Pixeln, in der alles untereinander steht: Felder, Knopf, Meldung und Hinweise. Der Blick bleibt beim Formular, und die Hinweise stehen dort, wo man sie braucht.</p></section>`+zustaende(A,'a'),
 b:`<section class="m-teil" id="varianteB"><h2>Variante B: Aufbau der Startseite</h2><p>Goldene Überschrift, breite Karte und schmale Spalte rechts wie auf der Startseite. Die Felder stehen nebeneinander, die Hinweise in der rechten Spalte, Meldungen über die ganze Breite.</p></section>`+zustaende(B,'b'),
};

/* nur zum Prüfen: ?nur=gemeinsam|a|b zeigt einen Teil für kürzere Screenshots */
const nur=new URLSearchParams(location.search).get('nur');
document.getElementById('inhalt').innerHTML=Object.keys(teile).filter(k=>!nur||k===nur).map(k=>teile[k]).join('');

const anker=(x)=>[['2a','Anmelden'],['3a','Registrieren'],['4a','Passwort'],['5a','Konto']].map(([z,t])=>`<a href="#${x}${z}">${z[0]} ${t}</a>`).join('');
document.getElementById('sprung').innerHTML=`<b>Gemeinsam</b><a href="#z1">1 Start</a><a href="#z6">6 Kopf angemeldet</a><b>Variante A</b>${anker('a')}<b>Variante B</b>${anker('b')}`;
</script>
</body>
</html>
