# Prüft täglich, ob der Lösch-Lauf des Workers (17 3 * * * in wrangler.jsonc) stattfand.
# Fehlt er, schlägt dieser Workflow fehl und GitHub schickt eine E-Mail.
# Einrichtung und Fehler: docs/tools/GitHub Actions - Einrichtung.md
name: Cron prüfen

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Das Skript braucht keine Abhängigkeiten, Node lädt TypeScript selbst
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Letzten Lauf in den Analytics suchen
        run: node scripts/cron-pruefen.ts
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
